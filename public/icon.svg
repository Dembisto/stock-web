<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070E0"/>
      <stop offset="100%" stop-color="#0052A3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)"/>

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Shopping Bag / Cash Register Symbol -->
  <g filter="url(#shadow)" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag Handle -->
    <path d="M192 192 V144 C192 108 220 80 256 80 C292 80 320 108 320 144 V192"/>
    <!-- Bag Body -->
    <rect x="112" y="176" width="288" height="256" rx="36" fill="#FFFFFF" fill-opacity="0.08"/>
    <!-- Laser scanner line inside -->
    <line x1="160" y1="288" x2="352" y2="288" stroke="#38BDF8" stroke-width="20"/>
    <!-- Barcode lines -->
    <line x1="176" y1="240" x2="176" y2="340" stroke="#FFFFFF" stroke-width="14"/>
    <line x1="212" y1="240" x2="212" y2="340" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="240" y1="240" x2="240" y2="340" stroke="#FFFFFF" stroke-width="16"/>
    <line x1="276" y1="240" x2="276" y2="340" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="304" y1="240" x2="304" y2="340" stroke="#FFFFFF" stroke-width="14"/>
    <line x1="336" y1="240" x2="336" y2="340" stroke="#FFFFFF" stroke-width="10"/>
  </g>
</svg>
